name: Validate and publish image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/apple050620312/haproxy-pterodactyl

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate sources
        run: |
          jq --exit-status '.meta.version == "PTDL_v2" and (.docker_images | length > 0)' egg-haproxy.json
          shellcheck docker/*.sh

      - name: Build test image
        run: docker build --tag haproxy-pterodactyl:test .

      - name: Smoke test generated configuration
        run: |
          container_id="$(docker run --detach \
            --env SERVER_PORT=25565 \
            --env BACKEND_HOST=127.0.0.1 \
            --env BACKEND_PORT=25566 \
            haproxy-pterodactyl:test)"
          trap 'docker rm --force "${container_id}" >/dev/null' EXIT

          for _ in {1..20}; do
            if docker logs "${container_id}" 2>&1 | grep --fixed-strings --quiet '[HAProxy] Proxy ready'; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "${container_id}")" != "true" ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 1
          done

          docker logs "${container_id}" 2>&1 | grep --fixed-strings '[HAProxy] Proxy ready'
          [[ "$(docker inspect --format '{{.State.Running}}' "${container_id}")" == "true" ]]
          docker exec "${container_id}" haproxy -c -f /home/container/haproxy.cfg

  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
